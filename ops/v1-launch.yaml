operational_incidents:
  - id: I1
    scope: morning_editorial_sweep
    launch_blocking: false
    status: verified
    observed_run_id: 74f33d1f-afec-4e6a-9f81-ddac4f54f8a4
    observed_at: "2026-10-07T08:30:04-06:00"
    diagnosis: >-
      The parent sweep aborted both implemented source requests at 105 seconds
      and marked the run failed, but the child ingestions completed successfully
      at 111 and 117 seconds.
    evidence:
      - parent run closed failed with no stale lock
      - Visit El Paso child run succeeded with 120 observations, 2 created, and 118 matched
      - KTEP child run succeeded with 120 observations, 4 created, and 116 matched
      - both child runs reported zero ingestion errors
      - no content drafts were created and no child run remains active
      - authenticated rerun completed with both implemented sources successful
      - rerun reported 0 failed sources, 8 unsupported sources, and 251 eligible events
    mitigation:
      - source batch reduced from 120 to 100 events
      - parent per-source wait increased from 105 to 120 seconds
      - fix committed at 2ee4645fe1a0cb01eb21563686b70b357062e587
      - heynow-sweep Edge Function version 7 deployed ACTIVE with JWT verification enabled
    blockers: []
    next_action: none


  - id: I2
    scope: publishing_desk
    launch_blocking: true
    status: resolved_by_product_reframe
    diagnosis: >-
      The deployed editor correctly implemented the original single-event
      contract, but that contract did not match Adam's carousel-first workflow.
      Save worked; Ready was blocked by unnamed missing fields, and Return to
      draft was hidden because the record had never reached ready.
    evidence:
      - reported draft f60dcc8b-351b-4383-873c-1fc79a44b240 saved twice and remained draft
      - missing caption, date, and venue explained the disabled Ready action
      - Adam explicitly chose carousel-only for Instagram V1
      - carousel editor now exposes event selection, order, readiness blockers, and Return to draft
    blockers: []
    next_action: >-
      Complete G4 release-candidate acceptance without changing production.


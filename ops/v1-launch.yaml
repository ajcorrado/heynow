sprint:
  id: heynow-instagram-v1-2026-10
  objective: >-
    Let Adam turn a trustworthy event into one finished 1080x1350 Instagram
    feed asset and caption, publish it manually from his phone, and record the
    live Instagram URL without changing canonical event facts.
  scope_frozen_at: "2026-10-05T20:14:12-06:00"
  branch: launch/instagram-v1
  base_sha: 2d51061e95aae3441f9d6e1fd7b1b0ee5da76939
  production_sha: 2d51061e95aae3441f9d6e1fd7b1b0ee5da76939
  release_candidate_sha: null
  current_gate: G0_baseline_truth
  last_checkpoint_at: "2026-10-05T20:31:00-06:00"
  resume_from: >-
    Finish G0 by verifying an authenticated production login and a clean build,
    then implement the additive content_drafts migration and Publishing Desk.
  target_release_date: "2026-10-10"
  timezone: America/Denver

operating_policy:
  source_of_truth: ops/v1-launch.yaml
  status_owner: release_orchestrator
  agent_result_format:
    - result
    - changed
    - proof
    - risks
    - attention
  retry:
    maximum_attempts: 2
  interrupt_adam_only_for:
    - credentials_or_access
    - security_or_data_integrity
    - brand_or_editorial_judgment
    - irreversible_external_action
    - production_go_no_go

continuity:
  checkpoint_after:
    - every_external_write
    - every_completed_work_item
    - before_any_expected_usage_pause
  checkpoint_contents:
    - exact_branch_and_commit
    - current_gate
    - passed_evidence
    - blockers
    - next_single_action
    - uncommitted_or_external_changes
  pause_rule: >-
    Stop at a committed boundary. Never leave a migration partly applied, a
    deployment promotion in progress, or multiple agents writing the same file.
  resume_rule: >-
    Read ops/v1-launch.yaml and the open launch pull request first, verify the
    recorded branch and deployment still match, then execute only resume_from.
  scheduled_resume_prompt: >-
    Resume the HeyNow Instagram V1 launch from ops/v1-launch.yaml. Reconcile the
    open launch pull request and live Vercel/Supabase state, do not repeat passed
    work, execute the next bounded item, checkpoint evidence, and stop for any
    irreversible production action or Adam decision.

scope:
  required:
    - existing_admin_sign_in
    - create_publication_draft_from_event
    - create_manual_publication_draft
    - edit_headline_take_caption_and_display_facts
    - preserve_canonical_event_and_source_evidence
    - generate_1080x1350_feed_asset
    - preview_and_download_asset
    - copy_caption_on_mobile
    - move_draft_to_ready_to_posted_or_skipped
    - record_posted_timestamp_and_instagram_url
  stretch:
    - 1080x1920_story_derivative
  deferred:
    - consumer_accounts
    - public_event_pages
    - user_submissions_saves_comments_or_feeds
    - direct_instagram_api_publishing
    - scheduled_social_publishing
    - carousels_and_roundups
    - unfinished_source_adapters
    - ten_source_ingestion_acceptance
    - automated_ingestion_scheduling
    - newsletter_delivery
    - permanent_monitoring_or_management_product

